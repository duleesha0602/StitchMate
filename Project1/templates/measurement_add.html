{% extends 'base.html' %}

{% block title %}{{ 'AddMeasurement'|t }} · StitchMate{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">{{ 'AddMeasurement'|t }}</h1>
        <p class="page-subtitle">Fill at least one value. All values use the same unit.</p>
    </div>
    <a href="{{ url_for('measurements.measurements_list') }}" class="btn btn-secondary">
        &larr; Back to Measurements
    </a>
</div>

<form method="POST" action="{{ url_for('measurements.measurement_add') }}" onsubmit="return validateMeasurementForm()">
    <!-- Card 1 matching screenshot ss8.PNG -->
    <div class="card" style="margin-bottom: 22px;">
        <div class="form-grid-3">
            <div class="form-group">
                <label class="form-label">{{ 'Customers'|t }} <span class="req">*</span></label>
                <select name="customer_id" class="form-control" required autofocus>
                    <option value="" disabled selected>Select Customer...</option>
                    {% for c in customers %}
                        <option value="{{ c.id }}" {% if selected_customer_id == c.id %}selected{% endif %}>
                            {{ c.nickname }} ({{ c.name }} · {{ c.customer_code }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'Date'|t }} <span class="req">*</span></label>
                <input type="date" name="measurement_date" class="form-control" value="{{ today_date }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'Unit'|t }} <span class="req">*</span></label>
                <select name="unit" class="form-control" required>
                    <option value="Inches" selected>Inches</option>
                    <option value="CM">CM</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Card 2: Core Measurements + Extended Fields (Req 7, 11) -->
    <div class="card">
        <h3 class="card-title" style="font-size: 20px;">Body Fit Points</h3>
        <div class="form-grid-4">
            <div class="form-group">
                <label class="form-label">{{ 'Chest'|t }}</label>
                <input type="number" step="0.1" min="0" name="chest" class="form-control measure-input" placeholder="e.g. 34">
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'Waist'|t }}</label>
                <input type="number" step="0.1" min="0" name="waist" class="form-control measure-input" placeholder="e.g. 28">
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'Hip'|t }}</label>
                <input type="number" step="0.1" min="0" name="hip" class="form-control measure-input" placeholder="e.g. 36">
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'Shoulder'|t }}</label>
                <input type="number" step="0.1" min="0" name="shoulder" class="form-control measure-input" placeholder="e.g. 14">
            </div>
        </div>

        <div class="form-grid-3">
            <div class="form-group">
                <label class="form-label">{{ 'SleeveLength'|t }}</label>
                <input type="number" step="0.1" min="0" name="sleeve_length" class="form-control measure-input" placeholder="e.g. 6">
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'DressLength'|t }}</label>
                <input type="number" step="0.1" min="0" name="dress_length" class="form-control measure-input" placeholder="e.g. 40">
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'Neck'|t }}</label>
                <input type="number" step="0.1" min="0" name="neck" class="form-control measure-input" placeholder="e.g. 15">
            </div>
        </div>

        <div class="form-grid-3" style="margin-top: 10px;">
            <div class="form-group">
                <label class="form-label">{{ 'ArmLength'|t }}</label>
                <input type="number" step="0.1" min="0" name="arm_length" class="form-control measure-input" placeholder="e.g. 22">
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'TrouserLength'|t }}</label>
                <input type="number" step="0.1" min="0" name="trouser_length" class="form-control measure-input" placeholder="e.g. 38">
            </div>
            <div class="form-group">
                <label class="form-label">{{ 'Inseam'|t }}</label>
                <input type="number" step="0.1" min="0" name="inseam" class="form-control measure-input" placeholder="e.g. 30">
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label class="form-label">{{ 'Notes'|t }}</label>
            <textarea name="notes" class="form-control" rows="3" placeholder="Optional fittings or customer preference notes..."></textarea>
        </div>
    </div>

    <div style="margin-top: 24px;">
        <button type="submit" class="btn">
            {{ 'SaveMeasurement'|t }}
        </button>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script>
    function validateMeasurementForm() {
        const inputs = document.querySelectorAll('.measure-input');
        let hasValue = false;
        inputs.forEach(input => {
            if (input.value && parseFloat(input.value) > 0) {
                hasValue = true;
            }
        });

        if (!hasValue) {
            alert('Condition check: Please fill in at least one measurement field (Chest, Waist, Hip, Shoulder, etc.) with a positive number.');
            return false;
        }
        return true;
    }
</script>
{% endblock %}
